<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Sudoku </title>

  <link rel="stylesheet" href="dist/sudoku.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    a {
      margin-top: 10px;
    }

    #sudoku {
      max-width: 600px;
      margin-inline: auto;
    }

    h1 {
      text-align: center;
      padding: 1em;
      color: #4b4441;
    }


    #info {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
    }

    ul {
      margin-top: 10px;
    }

    li {
      padding: .3em;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 0;
    }

    .links {
      margin-top: 50px;
      margin-inline: 50%;
    }
  </style>
  <script type="module">
    const start = performance.now()
    import { Sudoku, getCells } from "dist/sudoku.min.js"
    const c = getCells(37);

    Sudoku({ el: document.getElementById('sudoku'), cells: c.cells, solutions: c.solutions })
  </script>
</head>

<body>

  <h1>
    Sudoku
  </h1>
  <a href="./dev.html">Demo</a>
  <div id="sudoku"></div>
  <div class="links">
    <a href="github.com/rhnh">Github</a>
  </div>
  <div id="info">
    <ul class="features">
      <li>
        <h3>Features:</h3>
      </li>
      <li>Infield drag and drop</li>
      <li>Show Hint</li>
      <li>Multiple select using ctrl key</li>
      <li>Undo</li>
      <li>Hide Timer on click</li>
      <li>Zen mode</li>
      <li>Theme</li>
      <li>More to come</li>
      <li><a href="https://github.com/rhnh/sudoku">Source Code</a></li>
    </ul>
  </div>

</body>

</html>
